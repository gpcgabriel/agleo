[project]
name = "agleo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.1",
    "folium>=0.20.0",
    "geopy>=2.5.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "networkx>=3.4.2",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "streamlit-folium>=0.27.4",
]

[tool.ruff]
line-length = 120

# Configuring the quality gate (added by /quality-init)
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PL", "S"]
# Ignoring S311 everywhere: `random` draws the simulated scenarios from a fixed seed, where
# reproducibility matters and cryptographic strength does not.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "PLR2004"]
# Ignoring S603 in the tests: they run the project's own scripts with the running interpreter,
# never a command built from outside input.
"tests/*.py" = ["S603"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.complexipy]
max-complexity-allowed = 15

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=80"
pythonpath = ["."]

[tool.coverage.run]
omit = ["**/test_*.py"]

[tool.vulture]
paths = ["."]
exclude = [".venv/", "build/", "**/test_*.py"]
min_confidence = 80

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "pytest-cov>=7.1.0", "vulture>=2.16", "playwright>=1.63.0"]
